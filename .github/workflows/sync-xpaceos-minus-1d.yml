name: Espejo parcial de XpaceOS (portada y assets comunes)

# admira.store y xpaceos.com son gemelos que se desarrollan en paralelo (Carlos,
# 21-oct-2026). Este flujo copia de xpaceos SOLO la portada (index.html) y los
# assets comunes, sin borrar nada, del último commit que completó el despliegue
# de Pages; nunca una edición sin publicar. El sello, el castellano y la marca
# «admira.store» los pone sello-y-verja.py.

on:
  schedule:
    - cron: '15 5 * * *'   # cada día a las 07:15 de Madrid (05:15 UTC)
  # A mano: gh workflow run sync-xpaceos-minus-1d.yml -R csilvasantin/admira-store
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-xpaceos
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: store
      - uses: actions/checkout@v4
        with:
          repository: csilvasantin/xpaceos
          path: xpaceos
          fetch-depth: 0
      - name: Espejar la última versión publicada y hornear castellano
        working-directory: store
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: SmithMacMini
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: SmithMacMini
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          SYNC_SHA="$(gh api 'repos/csilvasantin/xpaceos/actions/workflows/pages.yml/runs?status=success&branch=main&per_page=1' --jq '.workflow_runs[0].head_sha')"
          test -n "$SYNC_SHA" && test "$SYNC_SHA" != null
          export SYNC_SHA
          bash ./sync-desde-xpaceos.sh ../xpaceos
          git add -A
          if git diff --cached --quiet; then
            echo "sin cambios"
            exit 0
          fi
          SELLO="$(sed -n 's/.*admiranext-version[^>]*content="\([^"]*\)".*/\1/p' index.html | head -1)"
          git commit -m "espejo parcial de xpaceos (portada y assets) · ${SELLO} · origen ${SYNC_SHA:0:7}"
          git push origin HEAD:main
