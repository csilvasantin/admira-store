name: Espejo XpaceOS publicado en castellano

# admira.store y XpaceOS comparten funcionalidad. Sincronizar únicamente el
# último commit que completó correctamente el despliegue de Pages; nunca una
# edición sin publicar. El sello y el castellano los pone sello-y-verja.py.

on:
  schedule:
    - cron: "20 4 * * *"   # 06:20 Madrid (UTC+2 en septiembre)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-xpaceos
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: store
      - uses: actions/checkout@v4
        with:
          repository: csilvasantin/xpaceos
          path: xpaceos
          fetch-depth: 0
      - name: Espejar la última versión publicada y hornear castellano
        working-directory: store
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: SmithMacMini
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: SmithMacMini
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          SYNC_SHA="$(gh api 'repos/csilvasantin/xpaceos/actions/workflows/pages.yml/runs?status=success&branch=main&per_page=1' --jq '.workflow_runs[0].head_sha')"
          test -n "$SYNC_SHA" && test "$SYNC_SHA" != null
          export SYNC_SHA
          bash ./sync-desde-xpaceos.sh ../xpaceos
          git add -A
          if git diff --cached --quiet; then
            echo "sin cambios"
            exit 0
          fi
          SELLO="$(sed -n 's/.*admiranext-version[^>]*content="\([^"]*\)".*/\1/p' index.html | head -1)"
          git commit -m "espejo xpaceos publicado · ${SELLO} · origen ${SYNC_SHA:0:7}"
          git push origin HEAD:main
