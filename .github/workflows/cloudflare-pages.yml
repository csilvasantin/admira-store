name: Cloudflare Pages (perímetro)

# admira.store pasa de GitHub Pages a Cloudflare Pages para ponerle un
# perímetro de seguridad en servidor (functions/_perimetro.js, que llega con el
# espejo de xpaceos · Carlos, 1-oct-2026, misión DCL-bdd079ab114d86b789f6ca65).
# El espejo empuja con GITHUB_TOKEN y ese push no dispara otros flujos, por eso
# además de `push` escuchamos el final del flujo del espejo.

on:
  push:
    # main publica en producción. vista-previa/** publica una vista previa con el mismo
    # proceso (tests, paquete, despliegue y comprobación) sin tocar producción.
    branches: [main, 'vista-previa/**']
  workflow_run:
    workflows: ["Espejo XpaceOS publicado en castellano", "Espejo parcial de XpaceOS (portada y assets comunes)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # El espejo llega por workflow_run, que no trae rama propia: siempre es main.
      RAMA: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Un fallo nuevo para aquí: ni paquete ni despliegue (scripts/ci-tests.mjs).
      - name: Tests
        run: node scripts/ci-tests.mjs
      - name: Construir y publicar
        id: publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -f functions/_perimetro.js || { echo "✗ falta el perímetro: el espejo aún no lo ha traído de xpaceos"; exit 1; }
          # Sin la dirección de vuelta registrada en Google, el login muere en
          # «redirect_uri_mismatch» (nos pasó dos veces). Se comprueba antes de publicar.
          if [ -f scripts/google-redirects.sh ]; then
            bash scripts/google-redirects.sh https://www.admira.store/auth/callback https://admira-store.pages.dev/auth/callback
          fi
          sha="$(git rev-parse HEAD)"
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/tests
          # El login solo protege páginas: lo interno se queda fuera de lo publicado (ver el script).
          bash .github/quitar-internos.sh _site
          # Hojas del sistema de diseño dentro del paquete (23-oct-2026, igual que xpaceos): ver .github/hojas-diseno-al-paquete.sh
          bash .github/hojas-diseno-al-paquete.sh _site
          release="$(sed -n 's/.*admiranext-version.*content="\(v\.[^"]*\)".*/\1/p' index.html | head -1)"
          deployer="$(jq -r '.deployer // empty' release-signature.json)"
          machine="$(jq -r '.machine // empty' release-signature.json)"
          test -n "$release"
          test "$release" = "$(jq -r '.version' release-signature.json)"
          novedades='[]'
          if [ -f novedades.json ]; then
            novedades="$(jq -c --arg v "$release" '(if type=="object" then (.[$v] // .default // .novedades // []) elif type=="array" then . else [] end) | if type=="array" then . else [] end | map(tostring) | map(select(length>0)) | .[0:4]' novedades.json 2>/dev/null || echo '[]')"
          fi
          [ -n "$novedades" ] || novedades='[]'
          # Cloudflare Pages solo admite archivos de hasta 25 MiB: los más grandes salen del paquete
          # y _redirects los manda (302) a la copia de XpaceOS. Automático, sin listas a mano.
          bash .github/cloudflare-grandes.sh _site "$sha"
          jq -n --argjson novedades "$novedades" --arg version "$release" --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployer "$deployer" --arg machine "$machine" --arg git "$sha" \
            '{version:$version,deployedAt:$deployedAt,deployer:$deployer,machine:$machine,signature:($deployer+" · "+$machine),git:$git,gitShort:($git[0:7]),gitFull:$git,dirty:false,novedades:$novedades,origin:"cloudflare-pages"}' \
            > _site/version.json
          npx --yes wrangler@4 pages deploy _site --project-name admira-store --branch "$RAMA" --commit-hash "$sha" 2>&1 | tee /tmp/wrangler.log
          if [ "$RAMA" = main ]; then
            base=https://www.admira.store
          else
            base="$(grep -oE 'https://[a-z0-9-]+\.admira-store\.pages\.dev' /tmp/wrangler.log | head -1)"
          fi
          test -n "$base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice title=Publicado::$base · $sha"
      # Lo privado sigue privado, lo público sigue público y lo interno no se publica.
      - name: Comprobar lo publicado
        env:
          BASE: ${{ steps.publicar.outputs.base }}
          SHA: ${{ steps.publicar.outputs.sha }}
        run: node scripts/smoke-perimetro.mjs "$BASE" "$SHA"
