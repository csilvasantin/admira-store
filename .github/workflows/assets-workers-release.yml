name: Release Assets workers
on:
  workflow_dispatch:
    inputs:
      api_sha:
        description: Verified full commit SHA in csilvasantin/pixer-worker
        required: true
      mcp_sha:
        description: Verified full commit SHA in csilvasantin/xpaceos-mcp
        required: true
      mcp_bundle_sha256:
        description: SHA-256 of the private source archive provided through temporary encrypted secrets
        required: true
permissions:
  contents: read
concurrency:
  group: assets-workers-release
  cancel-in-progress: false
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: csilvasantin/pixer-worker
          ref: ${{ inputs.api_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and deploy API
        env:
          EXPECTED_SHA: ${{ inputs.api_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm test
          npx --yes wrangler@4.154.0 deploy
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unpack verified private MCP source
        env:
          PART_1: ${{ secrets.ASSETS_MCP_BUNDLE_1 }}
          PART_2: ${{ secrets.ASSETS_MCP_BUNDLE_2 }}
          PART_3: ${{ secrets.ASSETS_MCP_BUNDLE_3 }}
          PART_4: ${{ secrets.ASSETS_MCP_BUNDLE_4 }}
          PART_5: ${{ secrets.ASSETS_MCP_BUNDLE_5 }}
          PART_6: ${{ secrets.ASSETS_MCP_BUNDLE_6 }}
          EXPECTED_SHA: ${{ inputs.mcp_sha }}
          BUNDLE_SHA256: ${{ inputs.mcp_bundle_sha256 }}
        run: |
          python3 - <<'PYCODE'
          import os,base64,gzip,hashlib,tarfile,io,pathlib,re
          expected=os.environ['EXPECTED_SHA']; digest=os.environ['BUNDLE_SHA256']
          assert re.fullmatch('[0-9a-f]{40}',expected) and re.fullmatch('[0-9a-f]{64}',digest)
          data=base64.b64decode(''.join(os.environ['PART_'+str(i)] for i in range(1,7)),validate=True)
          assert hashlib.sha256(data).hexdigest()==digest
          root=pathlib.Path('worker'); root.mkdir()
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(data))) as archive:
            archive.extractall(root,filter='data')
          assert (root/'.source-commit').read_text()==expected
          print('Verified private MCP release source')
          PYCODE
      - name: Verify and deploy MCP help
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --test assets-finish-2d-help.test.mjs
          npx --yes wrangler@4.154.0 deploy
