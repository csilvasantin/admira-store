name: Pantallas vivas · vista previa de rama

# Vista previa de la rama neo/pantallas-vivas (Neo · MacStudio, 13-oct-2026), con el mismo método que
# next-step-preview.yml: publica SOLO el alias de rama en Cloudflare Pages y comprueba que producción no cambia.
# Carlos: «siempre que sea posible trabajamos online, no en local». Se puede borrar al fusionar la rama.
on:
  push:
    branches: ["neo/pantallas-vivas"]
permissions:
  contents: read
concurrency:
  group: pantallas-vivas-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/neo/pantallas-vivas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de la mejora
        run: node --test admira-xp/scripts/screen-light.test.mjs admira-xp/scripts/scene-playlists.test.mjs admira-xp/scripts/screen-playlist.test.mjs
      - name: Publicar solo la vista previa de la rama y comprobar que producción no cambia
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_PROJECT: admira-store
          PREVIEW_BRANCH: pantallas-vivas-preview
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "neo/pantallas-vivas"
          test "$PREVIEW_BRANCH" != main
          test -n "$CLOUDFLARE_API_TOKEN"
          cat > /tmp/pantallas-vivas-production.py <<'PYTHON'
          import json, os, pathlib, sys, urllib.request
          url = 'https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/pages/projects/'+os.environ['PREVIEW_PROJECT']
          request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          assert data['success'], 'Pages project lookup failed'
          project = data['result']
          assert project['production_branch'] != os.environ['PREVIEW_BRANCH'], 'Refusing a production branch'
          current = project.get('canonical_deployment', {}).get('id')
          assert current, 'Production baseline unavailable'
          baseline = pathlib.Path('/tmp/pantallas-vivas-production-id')
          if sys.argv[1] == 'before':
              baseline.write_text(current)
          else:
              assert baseline.read_text() == current, 'Production changed during preview: investigate'
              print('Production deployment unchanged; only branch preview published.')
          PYTHON
          python3 /tmp/pantallas-vivas-production.py before
          preview_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$preview_dir"
          bash .github/cloudflare-grandes.sh "$preview_dir" "$GITHUB_SHA"
          npx --yes wrangler@4 pages deploy "$preview_dir" --project-name "$PREVIEW_PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$GITHUB_SHA"
          python3 /tmp/pantallas-vivas-production.py after
          echo "Preview: https://pantallas-vivas-preview.admira-store.pages.dev/admira-xp/?quality=matrix&loc=alsea-sbux-021&project=starbucks&circuit=alsea_starbucks" >> "$GITHUB_STEP_SUMMARY"
