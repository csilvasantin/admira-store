<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="admiranext-version" content="v.25.09.2026.r6.16:30">
<title>Entrada de planos · XpaceOS</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #07080c; color: #f4f1ea; font: 16px/1.45 system-ui, sans-serif; }
  main { width: min(720px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 48px; }
  a { color: #9be7ff; }
  input, button { font: inherit; }
  #drop { margin: 16px 0; padding: 22px; border: 1px dashed #3a4254; border-radius: 12px; }
  img, iframe { width: 100%; max-height: 480px; background: #000; border-radius: 12px; }
  pre { white-space: pre-wrap; background: #10141c; border-radius: 12px; padding: 12px; }
</style>
</head>
<body>
<main>
  <a href="/scan/levantado/">Volver al Xpacio levantado</a>
  <h1>Entrada de planos</h1>
  <p>Primer paso. Acepta una foto o un PDF del plano. El archivo se queda en este navegador: el levantamiento publicado todavía no lo aplica.</p>
  <form id="drop">
    <label>Foto o PDF <input id="file" type="file" accept="image/*,application/pdf"></label>
  </form>
  <div id="preview"></div>
  <pre id="note">Ningún plano cargado.</pre>
</main>
<script>
const input = document.querySelector('#file');
const preview = document.querySelector('#preview');
const note = document.querySelector('#note');
input.addEventListener('change', () => {
  const file = input.files && input.files[0];
  preview.replaceChildren();
  if (!file) {
    note.textContent = 'Ningún plano cargado.';
    return;
  }
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('image/')) {
    const image = document.createElement('img');
    image.alt = 'Plano cargado en este navegador';
    image.src = url;
    preview.append(image);
  } else if (file.type === 'application/pdf') {
    const frame = document.createElement('iframe');
    frame.title = 'PDF del plano';
    frame.src = url;
    preview.append(frame);
  }
  note.textContent = JSON.stringify({
    nombre: file.name,
    tipo: file.type || 'desconocido',
    bytes: file.size,
    aplicadoAlLevantamiento: false,
    href: '/scan/planos/',
  }, null, 2);
});
</script>
</body>
</html>
