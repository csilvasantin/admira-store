<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Corsair Galleon 100 SD · Gemelo 3D · Admira Store</title>
  <style>
    body { margin: 0; background: #070b15; color: #e5edf8; font: 14px/1.5 system-ui, sans-serif; }
    main { padding-top: var(--xs-bar-h, 0px); }
    main > header { padding: 16px 24px; }
    h1 { margin: 0; font-size: 19px; }
    #status { margin: 5px 0 0; color: #a5b8cc; }
    .galleon-workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 435px); gap: 20px; padding: 0 24px 24px; align-items: start; }
    .galleon-scene { min-width: 0; background: #10182b; border: 1px solid #26344a; border-radius: 14px; overflow: hidden; }
    #keyboard { display: block; width: 100%; height: min(57vh, 660px); min-height: 250px; touch-action: none; }
    .galleon-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px; border-top: 1px solid #26344a; }
    .galleon-controls label { flex: 1; min-width: 145px; }
    .galleon-controls select { display: block; width: 100%; margin-top: 4px; }
    .galleon-controls :is(button,select) { color: inherit; background: #182439; border: 1px solid #435779; border-radius: 6px; padding: 6px 8px; font: inherit; }
    #importer { display: block; width: 100%; height: 610px; border: 1px solid #26344a; border-radius: 14px; background: #0a0c12; }
    @media (max-width: 900px) { .galleon-workspace { grid-template-columns: 1fr; padding-inline: 14px; } #keyboard { height: min(44vh, 480px); } }
    #feed { position: absolute; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }
  </style>
  <link rel="stylesheet" href="/assets/xpace-shell.css?v=20261016-logo-1">
  <script defer src="/assets/xpace-shell.js?v=20261016-logo-1"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <main>
    <header><h1>Corsair Galleon 100 SD</h1><p id="status" role="status">Esperando la señal de Admira TV</p></header>
    <div class="galleon-workspace">
      <section class="galleon-scene" aria-label="Galleon 100 SD">
        <canvas id="keyboard" aria-label="Gemelo 3D del teclado Corsair Galleon 100 SD"></canvas>
        <div class="galleon-controls">
          <label>Playlist de prueba <select id="playlist"></select></label>
          <button type="button" id="previous" aria-label="Pieza anterior">◀</button>
          <button type="button" id="next" aria-label="Pieza siguiente">▶</button>
        </div>
      </section>
      <iframe id="importer" src="https://admira.tv/mando?embed=galleon&amp;screen=corsair-galleon-100" title="Importador de contenido del Galleon"></iframe>
    </div>
  </main>
  <iframe id="feed" src="https://admira.tv/galleon.html" tabindex="-1" title="Señal del player Galleon"></iframe>
  <script type="module" src="./twin.mjs"></script>
</body>
</html>
