<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="admiranext-version" content="v.25.09.2026.r9.19:08">
<title>Reponer · portal preparado · XpaceOS</title>
<style>
  body { margin: 0; background: #07080c; color: #f4f1ea; font: 16px/1.45 system-ui, sans-serif; }
  main { width: min(640px, calc(100% - 28px)); margin: 32px auto; }
  a { color: #9be7ff; }
  .aviso { border: 1px solid #8a6a22; border-radius: 12px; padding: 12px 16px; }
</style>
</head>
<body>
<main>
  <p><a href="/mobiliario/salas/">Volver a las salas</a></p>
  <h1>Reposición preparada</h1>
  <p class="aviso">El botón Reponer abre admira.shop/p/&lt;modelo&gt;/. El modelo de la pizarra es un ejemplo, ejemplo-pantalla. El identificador del equipo va en el enlace.</p>
  <p><a id="tienda" href="https://admira.shop/p/ejemplo-pantalla/?origen=yokup&amp;equipo=alsea-menu-3">Abrir admira.shop</a></p>
  <pre id="pedido"></pre>
</main>
<script>
const q = new URLSearchParams(location.search);
const raw = q.get('modelo') || '';
const modelo = /[a-z]/i.test(raw) ? raw.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') : 'ejemplo-pantalla';
const equipo = q.get('equipo') || q.get('elemento') || 'alsea-menu-3';
const shop = new URL(`https://admira.shop/p/${modelo}/`);
shop.searchParams.set('origen', 'yokup');
shop.searchParams.set('equipo', equipo);
for (const clave of ['local', 'pantalla']) {
  const valor = (q.get(clave) || '').trim();
  if (valor) shop.searchParams.set(clave, valor);
}
document.getElementById('tienda').href = shop.href;
document.getElementById('pedido').textContent = JSON.stringify({
  ejemplo: true,
  modelo,
  equipo,
  origen: 'yokup',
  destino: shop.href
}, null, 2);
</script>
</body>
</html>
