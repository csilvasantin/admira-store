<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de encaje · Sneaker Store</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:13px system-ui;background:#091017;color:#f4f7fa}body{display:grid;grid-template-rows:auto minmax(0,1fr) 76px}header{padding:10px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}label{display:flex;gap:4px;align-items:center}button,input,select{font:inherit;background:#14232f;color:white;border:1px solid #8294a3;border-radius:4px;padding:6px}input{width:72px}button[aria-pressed=true]{background:#ff00ff;color:#141414}#stage{position:relative;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%}footer{padding:5px 10px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}textarea{width:100%;height:62px;font:10px/1.2 monospace;resize:none;background:#111e29;color:#dceafa;border:1px solid #60717f}#status{font-weight:700}
</style>
<body><header>
<strong>Encaje de superficies · prueba GPU</strong>
<label>Escena <select id="scene" aria-label="Escena"><option value="entrada">Entrada</option><option value="centro">Centro</option><option value="fondo">Fondo</option></select></label>
<label>Superficie <select id="focus" aria-label="Superficie"></select></label><button id="center">Centrar superficie</button>
<label>Giro° <input id="yaw" aria-label="Giro" type="number" step="0.1"></label>
<label>Inclinación° <input id="pitch" aria-label="Inclinación" type="number" step="0.1" value="0" min="-77" max="77"></label>
<label>Campo° <input id="fov" aria-label="Campo" type="number" value="85" min="35" max="95" step="1"></label><button id="apply">Aplicar cámara</button>
<button id="original" aria-pressed="true" disabled>Fotografía original</button><button id="mapped" aria-pressed="false" disabled>Players magenta</button>
<a id="png-download" download="fit.png">Descargar PNG GPU</a><span id="status" role="status">Cargando…</span>
</header><main id="stage"><canvas id="qa-canvas" aria-label="Panorama de prueba GPU"></canvas></main>
<footer><label for="metadata">Datos visibles<br>para validar</label><textarea id="metadata" aria-label="Datos de validación" readonly></textarea></footer>
<script type="module">
import * as T from '../../admira-xp/scripts/premium-three.mjs';
import {angularPhotographMaterial} from '../../admira-xp/scripts/panorama-surface.mjs?v=surface-fit-1';
import {createCampaignOverlay} from '../../xpacios/sneakerstore/next-step/panorama-overlay.mjs?v=surface-fit-1';
import {PANORAMA_MAP} from '../../xpacios/sneakerstore/next-step/panorama-map.mjs?v=surface-fit-1';
import {INSTALLATIONS} from '../../xpacios/sneakerstore/next-step/render.mjs';
const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),canvas=$('qa-canvas');
const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(85,1,.1,20),geometry=new T.SphereGeometry(10,64,40);geometry.scale(-1,1,1);
const material=angularPhotographMaterial(),sphere=new T.Mesh(geometry,material);scene.add(sphere);scene.background=new T.Color('#080f14');
const masters=new Map(INSTALLATIONS.map(i=>{const texture=new T.DataTexture(new Uint8Array([255,0,255,255]),1,1,T.RGBAFormat);texture.colorSpace=T.SRGBColorSpace;texture.magFilter=texture.minFilter=T.NearestFilter;texture.generateMipmaps=false;texture.needsUpdate=true;return [i.id,texture];}));
const campaign={texture:id=>masters.get(id)},loader=new T.TextureLoader(),photos=new Map();let overlay=null,mapped=false,current='',serial=0,yaw=0,pitch=0;
function metadata(){const r=canvas.getBoundingClientRect(),map=PANORAMA_MAP[current];$('metadata').value=JSON.stringify({schema:'panorama-fit-native-v1',scene:current,mode:mapped?'mapped':'photograph',color:'#ff00ff',yaw,pitch,fov:camera.fov,viewport:{width:document.documentElement.clientWidth,height:document.documentElement.clientHeight},canvas:{x:r.x,y:r.y,width:r.width,height:r.height,pixelWidth:canvas.width,pixelHeight:canvas.height},grid:[2048,1024],masters:[...masters.keys()],surfaces:map?.surfaces.map(s=>({installation:s.installation,screen:s.screen,quad:s.quad,aperture:s.aperture||[s.quad[0],s.quad[1],s.quad[3],s.quad[2]]}))||[],occluders:map?.occluders||[]});}
function render(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.lookAt(Math.cos(pitch)*Math.cos(yaw),Math.sin(pitch),Math.cos(pitch)*Math.sin(yaw));camera.updateProjectionMatrix();camera.updateMatrixWorld(true);if(overlay)overlay.group.visible=mapped;renderer.render(scene,camera);$('png-download').href=canvas.toDataURL('image/png');$('png-download').download=`${current}-${mapped?'mapped':'photo'}.png`;metadata();}
function apply(){yaw=Number($('yaw').value)*Math.PI/180;pitch=T.MathUtils.clamp(Number($('pitch').value)*Math.PI/180,-1.35,1.35);camera.fov=T.MathUtils.clamp(Number($('fov').value),35,95);$('fov').value=String(camera.fov);render();}
function focus(){const index=Number($('focus').value),s=PANORAMA_MAP[current].surfaces[index];if(!s)return;const p=s.quad.reduce((a,p)=>[a[0]+p[0]/4,a[1]+p[1]/4],[0,0]);$('yaw').value=String(p[0]/2048*360);$('pitch').value=String(90-p[1]/1024*180);apply();}
function mode(value){mapped=value;$('original').setAttribute('aria-pressed',String(!value));$('mapped').setAttribute('aria-pressed',String(value));render();}
async function show(id){const ticket=++serial;$('status').textContent='Cargando…';$('original').disabled=$('mapped').disabled=true;try{let texture=photos.get(id);if(!texture){texture=await loader.loadAsync(`../../xpacios/sneakerstore/panoramas/${id}.jpg`);texture.colorSpace=T.SRGBColorSpace;texture.wrapS=T.RepeatWrapping;texture.generateMipmaps=false;texture.minFilter=T.LinearFilter;photos.set(id,texture);}if(ticket!==serial)return;overlay?.dispose();if(overlay)scene.remove(overlay.group);current=id;material.map=texture;material.needsUpdate=true;overlay=createCampaignOverlay(id,campaign,texture);scene.add(overlay.group);$('focus').replaceChildren(...PANORAMA_MAP[id].surfaces.map((s,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=`${index+1} · ${s.installation}${s.screen===undefined?'':` ${s.screen+1}`}`;return option;}));$('yaw').value=String(PANORAMA_MAP[id].yaw*180/Math.PI);$('pitch').value='0';if(query.get('focus')){const index=PANORAMA_MAP[id].surfaces.findIndex(s=>s.installation===query.get('focus'));if(index>=0){$('focus').value=String(index);focus();}}else apply();$('original').disabled=$('mapped').disabled=false;$('status').textContent=`Lista · ${id} · ${PANORAMA_MAP[id].surfaces.length} superficies · 7 masters`;render();}catch(error){$('status').textContent='Error: '+error.message;}}
$('scene').value=PANORAMA_MAP[query.get('scene')]?query.get('scene'):'entrada';if(query.has('fov'))$('fov').value=query.get('fov');$('scene').addEventListener('change',()=>show($('scene').value));$('center').addEventListener('click',focus);$('apply').addEventListener('click',apply);$('original').addEventListener('click',()=>mode(false));$('mapped').addEventListener('click',()=>mode(true));new ResizeObserver(()=>render()).observe(canvas);await show($('scene').value);
</script></body></html>
