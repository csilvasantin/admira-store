<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2 · Pantallas y muebles · Crea tu gemelo · admira.store</title>
<link rel="canonical" href="https://www.admira.store/xpacios/gemelo/2/">
<link rel="icon" href="/favicon.ico?v=20260522-r2" sizes="any">
<link rel="stylesheet" href="/xpacios/gemelo/gemelo.css?v=20261111-1">
<script>window.XPACE_SHELL={section:{es:'Crea tu gemelo · 2',en:'Create your twin · 2'},options:[{href:'/xpacios/gemelo/',es:'Crea tu gemelo',en:'Create your twin'},{href:'/xpacios/',es:'Todos los Xpacios',en:'All Xpaces'}]};</script>
<link rel="stylesheet" href="/assets/xpace-shell.css?v=20261016-logo-1">
<script defer src="/assets/xpace-shell.js?v=20261016-logo-1"></script>
</head>
<body>
<header data-shell-replace></header>
<main class="gm-wrap">
  <ol id="pasos"></ol>
  <h1>2 · <em>Pantallas y muebles</em></h1>
  <p class="gm-sub">Elige un elemento y pulsa sobre el plano para colocarlo. Arrastra para moverlo y selecciónalo para ponerle nombre, girarlo o quitarlo.</p>

  <div class="gm-edit">
    <div>
      <div class="gm-paleta" id="paleta"></div>
      <div class="gm-escena" style="margin-top:12px"><div id="plano"></div></div>
    </div>
    <aside class="gm-caja gm-ficha">
      <div class="gm-cuenta" id="cuenta"></div>
      <button type="button" id="vista">🧊 Ver en 3D</button>
      <div id="ficha" hidden class="gm-ficha">
        <div class="gm-sec-t" style="margin:6px 0 0" id="fichaT"></div>
        <input type="text" id="fichaN" maxlength="60" placeholder="Nombre (p. ej. Pantalla caja)">
        <div class="gm-fila"><button type="button" id="girar">↻ Girar</button><button type="button" id="dup">⧉ Duplicar</button><button type="button" id="quitar">✕ Quitar</button></div>
      </div>
      <p class="gm-nota" id="ayuda">Elige arriba un elemento y pulsa en el plano.</p>
      <button type="button" id="deshacer" disabled>↶ Deshacer</button>
    </aside>
  </div>

  <div class="gm-pie">
    <a class="gm-bot gm-sec" href="/xpacios/gemelo/1/">← 1 · Tu espacio</a>
    <button class="gm-bot" id="sig" disabled>Siguiente: publicar →</button>
  </div>
</main>
<script src="/xpacios/gemelo/gemelo.js?v=20261111-1"></script>
<script>
  const $ = id => document.getElementById(id);
  let b = Gemelo.carga();
  if (Gemelo.pasoListo(b, 2) < 2) location.replace('/xpacios/gemelo/1/');
  let tipo = 'pantalla', sel = null, iso = false, arrastre = null;
  const pila = [];

  $('paleta').innerHTML = Object.entries(Gemelo.TIPOS).map(([k, T]) =>
    '<button type="button" data-t="' + k + '"' + (T.pantalla ? ' class="gm-p"' : '') + '>' + T.e + ' ' + T.n + '</button>').join('');

  function item(id) { return b.items.find(i => i.id === id); }
  function pinta() {
    Gemelo.pasos($('pasos'), 2, b);
    Gemelo.pinta($('plano'), b, {iso, sel});
    document.querySelectorAll('#paleta button').forEach(x => x.setAttribute('aria-pressed', String(!iso && x.dataset.t === tipo)));
    const n = Gemelo.cuenta(b);
    $('cuenta').innerHTML = '<span class="gm-chip"><b>' + n.pantallas + '</b> pantallas</span><span class="gm-chip"><b>' + n.muebles + '</b> muebles</span>';
    const it = sel && item(sel);
    $('ficha').hidden = !it || iso;
    if (it) { $('fichaT').textContent = Gemelo.TIPOS[it.t].e + ' ' + Gemelo.TIPOS[it.t].n; if (document.activeElement !== $('fichaN')) $('fichaN').value = it.n; }
    $('vista').textContent = iso ? '✏️ Volver a editar' : '🧊 Ver en 3D';
    $('ayuda').textContent = iso ? 'Vista 3D: solo para mirar. Vuelve a editar para cambiar algo.' : (b.items.length ? 'Arrastra para mover. Supr borra el seleccionado.' : 'Elige arriba un elemento y pulsa en el plano.');
    $('deshacer').disabled = !pila.length;
    $('sig').disabled = !b.items.length;
  }
  function antes() { pila.push(JSON.stringify(b.items)); if (pila.length > 50) pila.shift(); }
  function guarda() { b = Gemelo.guarda(b); pinta(); }
  function punto(e) { const r = $('plano').getBoundingClientRect(); return {x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height}; }

  $('paleta').addEventListener('click', e => { const t = e.target.closest('button'); if (!t) return; tipo = t.dataset.t; iso = false; pinta(); });
  $('plano').addEventListener('pointerdown', e => {
    if (iso) return;
    const el = e.target.closest('.gm-el'); const p = punto(e);
    if (el) { sel = el.dataset.id; const it = item(sel); antes(); arrastre = {id: sel, dx: it.x - p.x, dy: it.y - p.y, el, movido: false}; $('plano').setPointerCapture(e.pointerId); pinta(); arrastre.el = $('plano').querySelector('[data-id="' + CSS.escape(sel) + '"]'); return; }
    if (b.items.length >= Gemelo.MAX_ITEMS) return;
    antes();
    const id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    b.items.push({id, t: tipo, x: p.x, y: p.y, r: 0, n: ''}); sel = id; guarda();
  });
  $('plano').addEventListener('pointermove', e => {
    if (!arrastre) return; const p = punto(e); const it = item(arrastre.id);
    it.x = Math.min(1, Math.max(0, p.x + arrastre.dx)); it.y = Math.min(1, Math.max(0, p.y + arrastre.dy)); arrastre.movido = true;
    arrastre.el.style.left = (it.x * 100) + '%'; arrastre.el.style.top = (it.y * 100) + '%';
  });
  $('plano').addEventListener('pointerup', () => { if (!arrastre) return; if (!arrastre.movido) pila.pop(); arrastre = null; guarda(); });
  $('fichaN').addEventListener('input', () => { const it = item(sel); if (it) { it.n = $('fichaN').value; guarda(); } });
  $('girar').addEventListener('click', () => { const it = item(sel); if (it) { antes(); it.r = (it.r + 90) % 360; guarda(); } });
  $('dup').addEventListener('click', () => { const it = item(sel); if (!it) return; antes(); const id = 'e' + Date.now().toString(36); b.items.push(Object.assign({}, it, {id, x: Math.min(1, it.x + .04), y: Math.min(1, it.y + .04)})); sel = id; guarda(); });
  function quita() { if (!sel) return; antes(); b.items = b.items.filter(i => i.id !== sel); sel = null; guarda(); }
  $('quitar').addEventListener('click', quita);
  document.addEventListener('keydown', e => { if ((e.key === 'Delete' || e.key === 'Backspace') && sel && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); quita(); } });
  $('deshacer').addEventListener('click', () => { if (!pila.length) return; b.items = JSON.parse(pila.pop()); sel = null; guarda(); });
  $('vista').addEventListener('click', () => { iso = !iso; pinta(); });
  $('sig').addEventListener('click', () => { location.href = '/xpacios/gemelo/3/'; });
  pinta();
</script>
</body>
</html>
