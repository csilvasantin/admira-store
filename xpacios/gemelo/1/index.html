<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 · Tu espacio · Crea tu gemelo · admira.store</title>
<link rel="canonical" href="https://www.admira.store/xpacios/gemelo/1/">
<link rel="icon" href="/favicon.ico?v=20260522-r2" sizes="any">
<link rel="stylesheet" href="/xpacios/gemelo/gemelo.css?v=20261111-2">
<script>window.XPACE_SHELL={section:{es:'Crea tu gemelo · 1',en:'Create your twin · 1'},options:[{href:'/xpacios/gemelo/',es:'Crea tu gemelo',en:'Create your twin'},{href:'/xpacios/',es:'Todos los Xpacios',en:'All Xpaces'}]};</script>
<link rel="stylesheet" href="/assets/xpace-shell.css?v=20261016-logo-1">
<script defer src="/assets/xpace-shell.js?v=20261016-logo-1"></script>
</head>
<body>
<header data-shell-replace></header>
<main class="gm-wrap">
  <ol id="pasos"></ol>
  <h1>1 · <em>Tu espacio</em></h1>
  <p class="gm-sub">Dale nombre al local y elige sobre qué lo dibujamos: una foto cenital, un plano o una cuadrícula en blanco.</p>

  <div class="gm-caja gm-campos">
    <label>Nombre del local *<input type="text" id="nombre" maxlength="80" placeholder="p. ej. Sneakers Santa Rosa 19" autocomplete="off"></label>
    <label>Ciudad / dirección<input type="text" id="ciudad" maxlength="80" placeholder="p. ej. Barcelona" autocomplete="off"></label>
    <label>Sector<select id="sector"></select></label>
  </div>

  <div id="plantillas"></div>

  <div class="gm-sec-t">Fondo del gemelo</div>
  <div class="gm-opciones" id="fondos">
    <button type="button" class="gm-op" data-fondo="foto"><big>📷</big><b>Foto del local</b><small>Mejor desde arriba o desde una esquina alta.</small></button>
    <button type="button" class="gm-op" data-fondo="plano"><big>📐</big><b>Plano</b><small>Imagen o captura del plano de planta.</small></button>
    <button type="button" class="gm-op" data-fondo="rejilla"><big>▦</big><b>Cuadrícula</b><small>Sin imagen: dibujas el local sobre una rejilla.</small></button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="gm-prev" id="prevWrap" hidden><div id="prev"></div><p class="gm-nota"><a href="#" id="otra">Cambiar imagen</a></p></div>
  <p class="gm-nota gm-err" id="err" hidden></p>

  <div class="gm-pie">
    <a class="gm-bot gm-sec" href="/xpacios/gemelo/">← Inicio</a>
    <button class="gm-bot" id="sig" disabled>Siguiente: pantallas y muebles →</button>
  </div>
</main>
<script src="/xpacios/gemelo/gemelo.js?v=20261111-2"></script>
<script>
  const $ = id => document.getElementById(id);
  let b = Gemelo.carga();
  $('sector').innerHTML = Object.entries(Gemelo.SECTORES).map(([k, v]) => '<option value="' + k + '">' + v + '</option>').join('');
  $('nombre').value = b.nombre; $('ciudad').value = b.ciudad; $('sector').value = b.sector;

  function refresca() {
    Gemelo.pasos($('pasos'), 1, b);
    document.querySelectorAll('[data-fondo]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.fondo === b.fondo.tipo)));
    const conImg = b.fondo.tipo !== 'rejilla';
    $('prevWrap').hidden = !(conImg && b.fondo.img);
    if (!$('prevWrap').hidden) Gemelo.pinta($('prev'), b);
    $('sig').disabled = !b.nombre || (conImg && !b.fondo.img);
    $('sig').title = !b.nombre ? 'Falta el nombre' : ($('sig').disabled ? 'Falta la imagen' : '');
  }
  function guarda() { b = Gemelo.guarda(b); refresca(); }
  ['nombre', 'ciudad', 'sector'].forEach(k => $(k).addEventListener('input', () => { b[k] = $(k).value; guarda(); }));
  document.querySelectorAll('[data-fondo]').forEach(x => x.addEventListener('click', () => {
    const t = x.dataset.fondo;
    if (t === 'rejilla') { b.fondo = {tipo:'rejilla', img:null, w:4, h:3}; guarda(); return; }
    if (b.fondo.tipo !== 'rejilla' && b.fondo.img) { b.fondo.tipo = t; guarda(); return; }
    b.fondo.tipo = t; refresca(); $('file').click();
  }));
  $('otra').addEventListener('click', e => { e.preventDefault(); $('file').click(); });
  $('file').addEventListener('change', async () => {
    const f = $('file').files[0]; if (!f) return;
    $('err').hidden = true;
    try {
      const r = await Gemelo.reduceImagen(f);
      // Los elementos ya colocados conservan su sitio relativo en el plano nuevo.
      b.fondo = {tipo: b.fondo.tipo === 'rejilla' ? 'foto' : b.fondo.tipo, img:r.img, w:r.w, h:r.h};
      guarda();
    } catch (e) { $('err').textContent = 'No se pudo usar esa imagen: ' + e.message; $('err').hidden = false; }
    $('file').value = '';
  });
  $('sig').addEventListener('click', () => { location.href = '/xpacios/gemelo/2/'; });
  $('nombre').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('sig').disabled) $('sig').click(); });
  refresca();
</script>
</body>
</html>
