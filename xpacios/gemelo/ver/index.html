<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemelo digital · admira.store</title>
<meta name="description" content="Gemelo digital de un local creado con admira.store: pantallas y muebles en su sitio.">
<link rel="icon" href="/favicon.ico?v=20260522-r2" sizes="any">
<link rel="stylesheet" href="/xpacios/gemelo/gemelo.css?v=20261111-2">
<style>
  .gm-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .gm-cab h1{margin:0}
  .gm-acc{display:flex;gap:8px;flex-wrap:wrap}
  .gm-vista{max-width:900px;margin:0 auto}
  /* Incrustado (?embed=1 o dentro de un iframe): solo el gemelo y la firma. */
  .gm-embed .gm-wrap{padding:12px 12px 8px}
  .gm-embed .gm-acc,.gm-embed #compartir{display:none}
  .gm-embed h1{font-size:20px}
  .gm-embed .gm-cab{margin-bottom:4px}
  .gm-embed .gm-vista{max-width:min(900px,calc((100vh - 130px) * 1.45))}
  .gm-firma{display:none;text-align:right;font-size:12px}
  .gm-embed .gm-firma{display:block}
  #compartir{margin:0 0 14px}
  #compartir textarea{width:100%;min-height:70px;background:#0f0705;border:1px solid var(--gm-line);border-radius:10px;color:var(--gm-ink);font:12px ui-monospace,monospace;padding:10px;margin-top:8px}
</style>
<script>if (/(^|[?&])embed=1/.test(location.search) || window.self !== window.top) document.documentElement.classList.add('gm-embed');</script>
<script>window.XPACE_SHELL={section:{es:'Gemelo',en:'Twin'},options:[{href:'/xpacios/gemelo/',es:'Crea tu gemelo',en:'Create your twin'},{href:'/xpacios/',es:'Todos los Xpacios',en:'All Xpaces'}]};</script>
<link rel="stylesheet" href="/assets/xpace-shell.css?v=20261016-logo-1">
<script defer src="/assets/xpace-shell.js?v=20261016-logo-1"></script>
</head>
<body>
<header data-shell-replace></header>
<main class="gm-wrap">
  <div class="gm-cab">
    <div>
      <h1 id="titulo">Cargando gemelo…</h1>
      <p class="gm-nota" id="sub"></p>
    </div>
    <div class="gm-acc" id="acc" hidden>
      <button class="gm-bot gm-sec" id="vista">✏️ Vista plano</button>
      <button class="gm-bot gm-sec" id="compartirBtn">🔗 Compartir</button>
      <a class="gm-bot" href="/xpacios/gemelo/">✨ Crea el tuyo</a>
    </div>
  </div>
  <div class="gm-caja" id="compartir" hidden>
    <div class="gm-ficha">
      <div class="gm-fila"><button type="button" id="copiar">🔗 Copiar enlace</button><button type="button" id="whatsapp">💬 WhatsApp</button><button type="button" id="linkedin">in LinkedIn</button></div>
    </div>
    <p class="gm-nota" style="margin:12px 0 0">Insertar en tu web:</p>
    <textarea id="iframe" readonly></textarea>
    <div class="gm-ficha" style="margin-top:8px"><div class="gm-fila"><button type="button" id="copiarIframe">&lt;/&gt; Copiar código</button></div></div>
    <p class="gm-nota" id="copiado" aria-live="polite"></p>
  </div>
  <div class="gm-cuenta" id="cuenta" style="margin-bottom:10px"></div>
  <div class="gm-escena gm-vista"><div id="plano"></div></div>
  <p class="gm-firma"><a href="/xpacios/gemelo/" target="_blank" rel="noopener">✨ Hecho con admira.store · crea el tuyo</a></p>
</main>
<script src="/xpacios/gemelo/gemelo.js?v=20261111-2"></script>
<script>
  const $ = id => document.getElementById(id);
  const id = new URLSearchParams(location.search).get('id') || '';
  let b = null, iso = true;
  function pinta() {
    Gemelo.pinta($('plano'), b, {iso});
    $('vista').textContent = iso ? '📐 Vista plano' : '🧊 Vista 3D';
  }
  async function abre() {
    try {
      // «borrador»: vista previa del gemelo que estás creando en este navegador.
      b = id === 'borrador' ? Gemelo.carga() : await Gemelo.cargaPublicado(id);
      if (!b.nombre) throw new Error('no encontrado');
    } catch (e) {
      $('titulo').textContent = 'No encontramos este gemelo';
      $('sub').innerHTML = 'Puede que el enlace esté mal copiado. <a href="/xpacios/gemelo/">Crea el tuyo en 3 pasos →</a>';
      return;
    }
    document.title = b.nombre + ' · Gemelo digital · admira.store';
    $('titulo').textContent = b.nombre;
    $('sub').textContent = [b.ciudad, Gemelo.SECTORES[b.sector]].filter(Boolean).join(' · ');
    const n = Gemelo.cuenta(b);
    $('cuenta').innerHTML = '<span class="gm-chip"><b>' + n.pantallas + '</b> pantallas</span><span class="gm-chip"><b>' + n.muebles + '</b> muebles</span>';
    $('acc').hidden = false;
    pinta();
  }
  $('vista').addEventListener('click', () => { iso = !iso; pinta(); });
  // Compartir: enlace con vista previa (la pone el servidor) y código para incrustar.
  const enlace = Gemelo.enlace(id), codigo = Gemelo.iframe(id);
  $('iframe').value = codigo;
  if (id === 'borrador') $('compartirBtn').hidden = true;
  async function copia(txt, msg) { try { await navigator.clipboard.writeText(txt); $('copiado').textContent = msg; } catch (e) { $('copiado').textContent = txt; } }
  $('compartirBtn').addEventListener('click', async () => {
    if (navigator.share && matchMedia('(pointer:coarse)').matches) { try { await navigator.share({title: document.title, url: enlace}); return; } catch (e) {} }
    $('compartir').hidden = !$('compartir').hidden;
  });
  $('copiar').addEventListener('click', () => copia(enlace, '✓ Enlace copiado'));
  $('copiarIframe').addEventListener('click', () => copia(codigo, '✓ Código copiado'));
  $('whatsapp').addEventListener('click', () => window.open('https://wa.me/?text=' + encodeURIComponent(document.title + ' ' + enlace), '_blank', 'noopener'));
  $('linkedin').addEventListener('click', () => window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(enlace), '_blank', 'noopener'));
  abre();
</script>
</body>
</html>
