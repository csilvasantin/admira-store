<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemelo digital · admira.store</title>
<meta name="description" content="Gemelo digital de un local creado con admira.store: pantallas y muebles en su sitio.">
<link rel="icon" href="/favicon.ico?v=20260522-r2" sizes="any">
<link rel="stylesheet" href="/xpacios/gemelo/gemelo.css?v=20261111-1">
<style>
  .gm-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .gm-cab h1{margin:0}
  .gm-acc{display:flex;gap:8px;flex-wrap:wrap}
  .gm-vista{max-width:900px;margin:0 auto}
</style>
<script>window.XPACE_SHELL={section:{es:'Gemelo',en:'Twin'},options:[{href:'/xpacios/gemelo/',es:'Crea tu gemelo',en:'Create your twin'},{href:'/xpacios/',es:'Todos los Xpacios',en:'All Xpaces'}]};</script>
<link rel="stylesheet" href="/assets/xpace-shell.css?v=20261016-logo-1">
<script defer src="/assets/xpace-shell.js?v=20261016-logo-1"></script>
</head>
<body>
<header data-shell-replace></header>
<main class="gm-wrap">
  <div class="gm-cab">
    <div>
      <h1 id="titulo">Cargando gemelo…</h1>
      <p class="gm-nota" id="sub"></p>
    </div>
    <div class="gm-acc" id="acc" hidden>
      <button class="gm-bot gm-sec" id="vista">✏️ Vista plano</button>
      <a class="gm-bot" href="/xpacios/gemelo/">✨ Crea el tuyo</a>
    </div>
  </div>
  <div class="gm-cuenta" id="cuenta" style="margin-bottom:10px"></div>
  <div class="gm-escena gm-vista"><div id="plano"></div></div>
</main>
<script src="/xpacios/gemelo/gemelo.js?v=20261111-1"></script>
<script>
  const $ = id => document.getElementById(id);
  const id = new URLSearchParams(location.search).get('id') || '';
  let b = null, iso = true;
  function pinta() {
    Gemelo.pinta($('plano'), b, {iso});
    $('vista').textContent = iso ? '📐 Vista plano' : '🧊 Vista 3D';
  }
  async function abre() {
    try {
      // «borrador»: vista previa del gemelo que estás creando en este navegador.
      b = id === 'borrador' ? Gemelo.carga() : await Gemelo.cargaPublicado(id);
      if (!b.nombre) throw new Error('no encontrado');
    } catch (e) {
      $('titulo').textContent = 'No encontramos este gemelo';
      $('sub').innerHTML = 'Puede que el enlace esté mal copiado. <a href="/xpacios/gemelo/">Crea el tuyo en 3 pasos →</a>';
      return;
    }
    document.title = b.nombre + ' · Gemelo digital · admira.store';
    $('titulo').textContent = b.nombre;
    $('sub').textContent = [b.ciudad, Gemelo.SECTORES[b.sector]].filter(Boolean).join(' · ');
    const n = Gemelo.cuenta(b);
    $('cuenta').innerHTML = '<span class="gm-chip"><b>' + n.pantallas + '</b> pantallas</span><span class="gm-chip"><b>' + n.muebles + '</b> muebles</span>';
    $('acc').hidden = false;
    pinta();
  }
  $('vista').addEventListener('click', () => { iso = !iso; pinta(); });
  abre();
</script>
</body>
</html>
