  const halo=new THREE.Mesh(new THREE.RingGeometry(.69,.86,72),new THREE.MeshBasicMaterial({color:0x223344,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false}));halo.position.z=.135;g.add(halo);
  g.position.set(...d.p);g.lookAt(new THREE.Vector3(...d.p).add(new THREE.Vector3(...d.n)));
  g.userData.n=n;caja.add(g);
  vents[n]={g,aspas,lcd,lcdMat,anilloMat,halo,tex:null};
}
for(let n=1;n<=7;n++)crearVentilador(n);
// RAM Lexar ARES RGB DDR5 ×2 sobre la placa (pared +x), hacia el interior (−x del zócalo).
const zocalo=new THREE.Mesh(new THREE.BoxGeometry(.18,.75,.75),new THREE.MeshStandardMaterial({color:0x3a4252,metalness:.7,roughness:.35}));zocalo.position.set(W/2-.3,3.9,-1.4);caja.add(zocalo);
const ramRGB=[];[0xff3df2,0x3dd8ff].forEach((c,i)=>{const z=-0.75+i*.22;
  const barra=new THREE.Mesh(new THREE.BoxGeometry(.28,1.5,.1),new THREE.MeshStandardMaterial({color:0x11151f,metalness:.6,roughness:.4}));barra.position.set(W/2-.35,3.7,z);caja.add(barra);
  const tira=new THREE.Mesh(new THREE.BoxGeometry(.3,.16,.12),new THREE.MeshBasicMaterial({color:c}));tira.position.set(W/2-.35,4.53,z);caja.add(tira);ramRGB.push(tira);const hl=new THREE.Mesh(new THREE.BoxGeometry(.04,1.3,.11),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.6}));hl.position.set(W/2-.5,3.7,z);caja.add(hl);ramRGB.push(hl);});
function actualizarTexturas(){
  for(let n=1;n<=7;n++){
    const v=vents[n];
    if(SIM){const tex=new THREE.CanvasTexture(simPlaceholder(n));tex.colorSpace=THREE.SRGBColorSpace;v.tex?.dispose();v.tex=tex;v.lcdMat.map=tex;v.lcdMat.color.set(0xffffff);v.lcdMat.needsUpdate=true;const im=document.querySelector(`img[data-mini="${n}"]`);if(im){im.onerror=null;im.src=simPlaceholder(n).toDataURL();}continue;}
    loader.load(API+'/miniatura/'+n+'.jpg?t='+Date.now(),tex=>{tex.colorSpace=THREE.SRGBColorSpace;v.tex?.dispose();v.tex=tex;v.lcdMat.map=tex;v.lcdMat.color.set(0xffffff);v.lcdMat.needsUpdate=true;},undefined,()=>{if(!SIM)return;const tex=new THREE.CanvasTexture(simPlaceholder(n));tex.colorSpace=THREE.SRGBColorSpace;v.tex?.dispose();v.tex=tex;v.lcdMat.map=tex;v.lcdMat.color.set(0xffffff);v.lcdMat.needsUpdate=true;});
    const img=document.querySelector(`img[data-mini="${n}"]`);if(img){img.onerror=()=>{if(SIM){img.onerror=null;img.src=simPlaceholder(n).toDataURL();}};img.src=API+'/miniatura/'+n+'.jpg?t='+Date.now();}
  }
  if(seleccionado)$('dImg').src=SIM?simPlaceholder(seleccionado).toDataURL():API+'/miniatura/'+seleccionado+'.jpg?t='+Date.now();
}
// Clic en un ventilador 3D → detalle
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(Object.values(vents).map(v=>v.g),true)[0];if(!hit)return;let o=hit.object;while(o&&!o.userData.n)o=o.parent;if(o)abrir(o.userData.n);});

// Color que muestra cada anillo, imitando el efecto del controlador (para el gemelo, no es medida).
function colorAnillo(n,t){
  const inf=estado?.informe,l=(inf?.luz)||luz,e=inf?.escena,propia=l?.ventiladores?.[n]||l;
  if(!l||propia.efecto==='apagado')return new THREE.Color(0x0b0f18);
  const brillo=(propia.brillo??4)/4,vel=.25+(propia.velocidad??2)*.25,base=new THREE.Color(hex((propia.colores&&propia.colores[0])||propia.color));
  let c=base.clone();
  if(l.sigueVideo&&e?.modo==='sincro'&&!activoSincro(e,n))return new THREE.Color(0x0b0f18);
  switch(propia.efecto){
    case 'arcoiris':c.setHSL((t*.12*vel+n*.14)%1,1,.55);break;
    case 'ciclo':c.setHSL((t*.1*vel)%1,1,.55);break;
    case 'respirar':c.multiplyScalar(.2+.8*(.5+.5*Math.sin(t*2*vel)));break;
    case 'meteoro':case 'carrera':case 'ola':{const fase=(t*vel*1.4-n*.45)%7;c.multiplyScalar(.15+.85*Math.max(0,1-Math.abs(((fase%7)+7)%7-3.5)/1.6));break;}
  }
  return c.multiplyScalar(Math.max(.08,brillo));
}
function activoSincro(e,n){
  const orden=e.orden||[1,2,3,4,5,6,7],pos=orden.indexOf(n);if(pos<0)return false;
  const paso=Math.floor(Math.max(0,(Date.now()+desfasePC-(e.epoch||0))/1000)/(e.paso||4)),N=orden.length;
  return ((((pos-paso)%N)+N)%N)<(e.piezas||[]).length;
}

const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(512,512),.9,.5,.55);composer.addPass(bloom);composer.addPass(new OutputPass());
function tamano(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',tamano);tamano();
const reloj=new THREE.Clock();
function bucle(){
  requestAnimationFrame(bucle);
  const t=reloj.getElapsedTime();
  for(let n=1;n<=7;n++){
    const v=vents[n],f=(estado?.informe?.fans||[]).find(x=>x.n===n),rpm=f?.rpm||600;
    v.aspas.rotation.z-=rpm/600*.06;
    const c=colorAnillo(n,t);v.anilloMat.color.copy(c);v.halo.material.color.copy(c);
    const el=document.querySelector(`.vent[data-n="${n}"] .disco`);if(el)el.style.setProperty('--anillo','#'+c.getHexString());
  }
  if(seleccionado)$('dImg').style.borderColor='#'+colorAnillo(seleccionado,t).getHexString();
  ramRGB.forEach((m,i)=>m.material.color.setHSL((t*.15+i*.25+Math.sin(t*3+i)*.05)%1,1,.5+.15*Math.sin(t*4+i)));
  ledMat[0].color.setHSL((.5+.05*Math.sin(t))%1,1,.45+.1*Math.sin(t*2));ledMat[1].color.setHSL((.85+.05*Math.sin(t*1.3))%1,1,.45+.1*Math.cos(t*2));
  anillosScan.forEach((m,i)=>{m.rotation.z=t*(i%2?-.2:.3);});const k=(t*.35)%1;pulso.scale.setScalar(2+k*9);pulso.material.opacity=.8*(1-k);
  particulas.rotation.y=t*.02;particulas.position.y=Math.sin(t*.4)*.2;
  trazaMat.opacity=.35+.25*Math.sin(t*2.5);
  if(t>1.2){const bt=document.getElementById('boot');if(bt&&bt.style.opacity!=='0'){bt.style.opacity='0';setTimeout(()=>bt.remove(),900);}}
  controls.update();composer.render();
}
bucle();

// ── Estado en vivo ──
async function refrescar(){
  try{
    estado=await api('estado');
    if(SIM&&!estado.enLinea&&simInforme)estado.informe={...(estado.informe||{}),...simInforme};
    const on=estado.enLinea,visto=estado.visto?Math.round((estado.ahora-estado.visto)/1000):null;
    $('estado').className='estado '+(on?'on':'off');
    $('estadoTxt').textContent=on?'METAHUMAN en línea':(visto==null?'METAHUMAN sin conectar':'Sin señal · hace '+visto+' s');
    if(SIM&&!on){$('estado').className='estado sim';$('estadoTxt').textContent='Gemelo en simulación · PC apagado';}
    const d=estado.deseado||{},inf=estado.informe||{};
    // Hora de METAHUMAN vista desde aquí: su reloj no tiene por qué coincidir con el del navegador.
    if(inf.at&&estado.visto)desfasePC=(inf.at-estado.visto)-(Date.now()-estado.ahora);
    // Los controles enseñan lo más reciente: lo pedido aquí o lo que la máquina ya aplicó (también
    // puede cambiar en local, desde config.json o su API).
    const vigente=(Number(inf.revision)||0)>=(Number(d.revision)||0)?inf:d;
    if(!editandoEscena&&!interactuando()&&(vigente.escena||d.escena)){const e=vigente.escena||d.escena;escena={...escena,...e,ids:{...(e.ids||{})},piezas:[...(e.piezas||[])]};pintarModos();}
    if(!editandoLuz&&(vigente.luz||d.luz)){const l=vigente.luz||d.luz;luz={...luz,...l,color:hex((l.colores&&l.colores[0])||l.color),ventiladores:l.ventiladores||{}};pintarLuz();}
    const aplicando=d.revision&&inf.revision!==undefined&&d.revision>inf.revision;
    $('pendEscena').textContent=aplicando?'Aplicando en METAHUMAN…':(d.por?'Último cambio: '+d.por:'');
    $('pendLuz').textContent=aplicando?'Aplicando en METAHUMAN…':'';
    for(const f of inf.fans||[]){const m=document.querySelector(`[data-meta="${f.n}"]`);if(m)m.textContent=`${f.rpm??'—'} rpm · ${f.fps??0} fps`;}
    if(!interactuando())pintarDetalle();
  }catch(err){
    if(SIM&&err.message!=='login'){estado={...(estado||{}),enLinea:false,informe:{...(estado?.informe||{}),...(simInforme||{})}};$('estado').className='estado sim';$('estadoTxt').textContent='Gemelo en simulación · sin nube';}
    else if(err.message!=='login'){$('estado').className='estado off';
      $('estadoTxt').textContent=err.message==='not_configured'?'Nube sin configurar (falta SUPERCOMPUTER_PROXY_KEY)':'Sin conexión con la nube';}
  }finally{$('carga').classList.add('hide');}
}
async function cargarStock(){
  try{const d=await fetch(STOCK).then(r=>r.json());stock=(d.items||[]).filter(x=>x&&x.id&&['video','image'].includes(x.type)).map(x=>({id:x.id,num:x.num,title:x.title||x.id,type:x.type,url:x.url||null,thumbnail:x.thumbnail||null,mime:x.mime||'',size:x.size||0}));}
  catch{stock=[];}
  pintarModos();
}
$('simMode').checked=SIM;
$('simMode').onchange=e=>{SIM=e.target.checked;localStorage.setItem(SIM_KEY,SIM?'1':'0');toast(SIM?'Modo solo gemelo activado (simulación)':'Modo simulación desactivado');if(SIM&&!simInforme){simAplicar('luz',luz);simAplicar('escena',escena);}refrescar();actualizarTexturas();};
if(SIM){simAplicar('luz',luz);simAplicar('escena',escena);}
pintarModos();pintarLuz();cargarStock();refrescar();
setInterval(refrescar,2500);setInterval(actualizarTexturas,3000);actualizarTexturas();
