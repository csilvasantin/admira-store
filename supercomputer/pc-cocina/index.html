<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const API='/supercomputer/pc-cocina/api';
const STOCK='https://api.admira.store/stock/list?limit=300';   // respaldo: solo las 200 más recientes
// Índice completo del Stock (el mismo que usa functions/admira-xp/media-catalog.js): todas las piezas con sus tags y
// su portada, ~370 KB comprimido. Se carga una vez al abrir el gemelo.
const STOCK_INDICE='https://stock.admira.store/stock/index.json';
const $=id=>document.getElementById(id);

// ── Modos y efectos (mismos nombres que el puente: admira-tv/tools/player-ventiladores/escena.mjs) ──
const MODOS={
  independiente:'Cada ventilador es un player de admira.tv con su propia pieza.',
  repetir:'La misma pieza en los 7 a la vez, en sincronía exacta.',
  extender:'Una pieza estirada sobre los 7 como un mural: cada ventilador muestra su tesela.',
  sincro:'La pieza pasa de un ventilador al siguiente sin perder el hilo. Con varias piezas, desfilan en carrusel.',
  secuencia:'El vídeo se reproduce entero en el 1, luego entero en el 2… hasta el 7, y vuelta a empezar. La luz acompaña al vídeo: solo brilla el ventilador que lo tiene.',
  identificar:'Cada pantalla enseña su número, su puerto y su posición, para ubicar los ventiladores en la caja.'
};
const EFECTOS=[['apagado','Apagado'],['fijo','Fijo'],['arcoiris','Arcoíris'],['respirar','Respirar'],['ciclo','Ciclo'],['meteoro','Meteoro'],['ola','Ola'],['carrera','Carrera']];
const SWATCHES=['#00d26a','#8fd6ff','#2b6cff','#ffce3a','#ff6a3d','#ff2d78','#b26bff','#ffffff'];

// Disposición física de PC-COCINA (Carlos, foto y capturas anotadas del 6-nov-2026), vista por el cristal grande
// (+x). La pared de la placa es −x; la izquierda (+z) es la trasera de la caja y la derecha (−z) la delantera.
// Los 7 ventiladores tienen pantalla y vídeo; el número es el del puente: 1 = único del puerto 0; 2-3-4 = puerto 1;
// 5-6-7 = puerto 2, con la numeración lógica de su config.json («numeracion»: {"2:0": 7, "2:2": 5}) para que la
// secuencia suba desde el suelo: la cadena del puerto 2 va de arriba abajo.
//  · 1: solo, en la pared trasera (izquierda), arriba, de lado y mirando hacia dentro.
//  · 2-3-4: en el suelo, horizontales, caras arriba, de izquierda a derecha.
//  · 5-6-7: en la pared de la placa, en columna justo a su derecha (junto al peine de 24 pines), de ABAJO ARRIBA
//    (el 5 junto al 4 del suelo, el 7 arriba) y mirando de frente.
// Confirmado el 6-nov-2026 con Identificar: el 1 por su vídeo y el suelo 2-3-4 (izq->der) por Carlos; la columna,
// con la webcam de PC-COCINA (por la tarde, tras la numeración lógica, el de abajo enseña el 5). Si cambia el
// cableado, se tocan esta tabla y «numeracion».
const VENTILADORES=[1,2,3,4,5,6,7];
const DISPOSICION={
  1:{p:[-0.95,3.75,3.14],n:[0,0,-1]},
  2:{p:[0.45,0.18,1.75],n:[0,1,0]},3:{p:[0.45,0.18,0.2],n:[0,1,0]},4:{p:[0.45,0.18,-1.35],n:[0,1,0]},
  5:{p:[-1.9,1.3,-2.4],n:[1,0,0]},6:{p:[-1.9,2.75,-2.4],n:[1,0,0]},7:{p:[-1.9,4.2,-2.4],n:[1,0,0]}
};

let estado=null, escena={modo:'independiente',ids:{},piezas:[],paso:4,ajuste:'cubrir',columnas:7}, luz={efecto:'fijo',color:'#00d26a',brillo:4,velocidad:2,sigueVideo:false,ventiladores:{},dispositivos:{}};
let stock=[], pintadaEscena='', editandoEscena=false, editandoLuz=false, seleccionado=null, soloLectura=false, desfasePC=0;

// ── Utilidades ──
const hex=c=>Array.isArray(c)?'#'+c.map(v=>Number(v).toString(16).padStart(2,'0')).join(''):(c||'#ffffff');
function toast(t,error){const el=$('toast');el.textContent=t;el.className='hud toast show'+(error?' error':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='hud toast',2600);}
async function api(ruta,cuerpo){
  const r=await fetch(API+'/'+ruta,cuerpo?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cuerpo)}:{cache:'no-store'});
  if(r.status===401){location.href='/auth/login?return_to='+encodeURIComponent('/supercomputer/pc-cocina/');throw new Error('login');}
  const d=await r.json().catch(()=>({}));
  if(r.status===403&&d.error==='read_only'){soloLectura=true;}
  if(!r.ok||d.ok===false)throw new Error(d.error||('HTTP '+r.status));
  return d;
}
function piezaTxt(id){const s=stock.find(x=>x.id===id);return s?('#'+s.num+' · '+s.title):id;}
const esc=t=>String(t??'').replace(/[<&"]/g,c=>({'<':'&lt;','&':'&amp;','"':'&quot;'}[c]));
// Tag elegido encima de las piezas (preferencia de quien mira: se recuerda en este navegador).
let tagFiltro=(()=>{try{return localStorage.getItem('admira.supercomputer.pccocina.tag')||'';}catch{return '';}})();
let tagsOrdenados=[];
function filaTag(){
  if(!stock.length)return '';
  const opciones=tagsOrdenados.map(([t,n])=>`<option value="${esc(t)}"${t===tagFiltro?' selected':''}>${esc(t)} (${n})</option>`).join('');
  return `<div class="fila"><label>Tag</label><select id="tagFiltro" aria-label="Filtrar las piezas por tag"><option value="">Todos · all (${stock.length})</option>${opciones}</select></div>`;
}
// Botón de pieza: su portada y su título; al pulsarlo se abre la lista con portadas.
function botonPieza(tipo,clave,sel,vacio){
  const p=stock.find(x=>x.id===sel);
  const img=p?.thumb?`<img src="${esc(p.thumb)}" alt="" loading="lazy">`:'<i></i>';
  return `<button type="button" class="pieza" data-${tipo}="${clave}" data-id="${esc(sel||'')}" data-vacio="${esc(vacio)}">${img}<span>${sel?esc(piezaTxt(sel)):esc(vacio)}</span></button>`;
}
let popBoton=null;
const pasaTag=p=>!tagFiltro||p.tags.includes(tagFiltro);
function pintarLista(){
  const q=$('piezasBuscar').value.trim().toLowerCase(),actual=popBoton?.dataset.id||'';

  const todas=stock.filter(p=>pasaTag(p)&&casa(p)),MAX=250,vistas=todas.slice(0,MAX);

function abrirPiezas(b){
  popBoton=b;const pop=$('piezasPop'),r=b.getBoundingClientRect();

function cerrarPiezas(){$('piezasPop').classList.remove('open');popBoton=null;}
function elegirPieza(b,id){
  if(b.dataset.ind){escena.ids[b.dataset.ind]=id?[id]:[];}
  else{const i=+b.dataset.pieza,p=escena.piezas.slice();p[i]=id;escena.piezas=p.filter(Boolean);}

$('piezasBuscar').oninput=pintarLista;
$('piezasLista').onclick=e=>{const o=e.target.closest('[data-elige]');if(!o||!popBoton)return;const b=popBoton;cerrarPiezas();elegirPieza(b,o.dataset.elige);};

    o.innerHTML=filaTag()+VENTILADORES.map(n=>`<div class="fila"><label>Vent. ${n}</label>${botonPieza('ind',n,(escena.ids[n]||[])[0],'Playlist del canal')}</div>`).join('');
  }else if(escena.modo==='repetir'){
    o.innerHTML=filaTag()+`<div class="campo"><label>Pieza en los 7</label>${botonPieza('pieza',0,escena.piezas[0],'— elige pieza —')}</div>`;
  }else if(escena.modo==='extender'){
    o.innerHTML=filaTag()+`<div class="campo"><label>Pieza del mural</label>${botonPieza('pieza',0,escena.piezas[0],'— elige pieza —')}</div>

      <div class="fila f3"><label>Columnas</label><input type="range" id="columnas" min="1" max="7" value="${escena.columnas||7}"><span class="val" id="columnasV">${escena.columnas||7}</span></div>`;
    $('ajuste').value=escena.ajuste||'cubrir';

    $('ajuste').onchange=e=>{escena.ajuste=e.target.value;editandoEscena=true;};
  }else if(escena.modo==='identificar'){
    o.innerHTML='';
  }else if(escena.modo==='secuencia'){
    // Cambio de ventilador: al acabar la pieza (cada=0, por defecto) o cada x segundos (escena.cada del puente).
    const cada=Number(escena.cada)>0?Number(escena.cada):0;
    o.innerHTML=filaTag()+`<div class="campo"><label>Vídeo · entero en cada ventilador, del 1 al 7</label>${botonPieza('pieza',0,escena.piezas[0],'— elige pieza —')}</div>`+
      `<div class="campo"><label>Cambio de ventilador · switch</label><div class="relevo">
        <button type="button" class="efecto${cada?'':' on'}" id="cadaFin">Al acabar · on end</button>
        <div class="pasos${cada?' on':''}" id="cadaPasos" title="Segundos en cada ventilador">
          <button type="button" data-paso="-1" aria-label="Un segundo menos">‹</button>
          <input id="cadaS" type="number" min="1" max="3600" step="1" inputmode="numeric" value="${cada||ultimoCada}" aria-label="Segundos en cada ventilador">
          <button type="button" data-paso="1" aria-label="Un segundo más">›</button><small>s</small>
        </div></div></div><p class="desc" id="cadaDesc"></p>`;
    pintarCada();
    $('cadaFin').onclick=()=>{escena.cada=0;editandoEscena=true;pintarCada();};
    $('cadaPasos').onclick=e=>{const b=e.target.closest('[data-paso]');if(b)ponerCada((Number(escena.cada)>0?Number(escena.cada):ultimoCada)+Number(b.dataset.paso));else if(e.target.id!=='cadaS'&&!(escena.cada>0))ponerCada(ultimoCada);};
    $('cadaS').onfocus=()=>{if(!(escena.cada>0))ponerCada(+$('cadaS').value||ultimoCada,false);};
    $('cadaS').oninput=()=>{const v=parseInt($('cadaS').value,10);if(v>0)ponerCada(v,false);};
    $('cadaS').onchange=()=>ponerCada(parseInt($('cadaS').value,10)||ultimoCada);
  }else{
    const n=Math.max(1,escena.piezas.length);
    o.innerHTML=filaTag()+Array.from({length:Math.min(7,n+1)},(_,i)=>`<div class="fila"><label>${i?'Pieza '+(i+1):'Pieza'}</label>${botonPieza('pieza',i,escena.piezas[i],i?'— otra pieza (opcional) —':'— elige pieza —')}</div>`).join('')+
      `<div class="fila f3"><label>Paso</label><input type="range" id="paso" min="1" max="30" value="${escena.paso||4}"><span class="val" id="pasoV">${escena.paso||4} s</span></div>`;

  }

// ── Secuencia: segundos en cada ventilador ──
let ultimoCada=10;   // lo que enseña «‹ x › s» mientras está en «Al acabar»; 10 por defecto
function ponerCada(v,repintar=true){
  v=Math.max(1,Math.min(3600,Math.round(Number(v)||ultimoCada)));
  escena.cada=v;ultimoCada=v;editandoEscena=true;
  if(repintar&&$('cadaS'))$('cadaS').value=v;
  pintarCada();
}
function pintarCada(){
  if(!$('cadaDesc'))return;
  const cada=Number(escena.cada)>0?Number(escena.cada):0;
  $('cadaFin').classList.toggle('on',!cada);$('cadaPasos').classList.toggle('on',!!cada);
  const inf=estado?.informe?.escena,d=inf?.modo==='secuencia'&&inf.piezas?.[0]===escena.piezas[0]?Number(inf.duracion)||0:0;
  const pieza=stock.find(x=>x.id===escena.piezas[0]);
  $('cadaDesc').textContent=cada?`${cada} s en cada ventilador, desde el principio de la pieza · una vuelta a los 7 tarda ${cada*7} s.`
    :d?`Pasa al siguiente al acabar: dura ${d.toFixed(1)} s · una vuelta a los 7 tarda ${Math.round(d*7)} s.`
    :pieza?.type==='image'?'Una imagen no se acaba: 10 s en cada ventilador (o los que pongas).':'Pasa al siguiente al acabar la pieza.';
}

// ── Audio (escena.audio del puente: escena.mjs · normalizarAudio) ──
// Como mucho suena un ventilador (su Chrome es el único sin silenciar). La salida es el nombre del dispositivo de

    :VENTILADORES.map(n=>`<option value="${n}">Ventilador ${n}</option>`).join(''));
  $('audioVent').value=String(repetir&&a.ventilador>0?1:a.ventilador);

$('audioVent').onchange=e=>{escena.audio={...audioDe(escena),ventilador:+e.target.value};editandoEscena=true;};
$('audioSalida').onchange=e=>{escena.audio={...audioDe(escena),salida:e.target.value};editandoEscena=true;};
$('audioVol').oninput=e=>{$('audioVolV').textContent=e.target.value;escena.audio={...audioDe(escena),volumen:+e.target.value/100};editandoEscena=true;};
$('aplicarEscena').onclick=async()=>{
  const e={modo:escena.modo};
  if(escena.modo==='independiente')e.ids=escena.ids;
  else e.piezas=escena.piezas;
  if(escena.modo==='extender'){e.ajuste=escena.ajuste;e.columnas=escena.columnas;}
  if(escena.modo==='sincro')e.paso=escena.paso;
  if(escena.modo==='secuencia'){e.piezas=escena.piezas.slice(0,1);e.cada=Number(escena.cada)>0?Number(escena.cada):0;}   // un solo vídeo; su duración la mide el puente
  e.audio=audioDe(escena);
  if(escena.modo==='identificar')delete e.piezas;
  else if(escena.modo!=='independiente'&&!e.piezas.length){toast('Elige al menos una pieza',true);return;}
  try{$('aplicarEscena').disabled=true;await api('escena',e);editandoEscena=false;toast('Escena enviada a PC-COCINA');refrescar();}
  catch(err){toast(soloLectura?'Tu acceso es de solo lectura':'No se pudo enviar: '+err.message,true);}

// ── Panel de iluminación ──
// Destino de los controles: la luz general (ventiladores y todo lo que no tenga luz propia) o una de las otras luces de
// la caja, que el puente controla por el Strimer Plus (los dos cables), por la AIO Galahad II Trinity (los ventiladores de
// arriba, los del radiador sin pantalla, y la bomba) o, cuando tenga driver, por SMBus (la memoria).
// Mismo contrato que el puente: luz.dispositivos.{grafica,placa,superiores,bomba,memoria} (escena.mjs · normalizarLuz).
const DISPOSITIVOS={
  grafica:{t:'Cable gráfica',s:'Strimer · GPU cable'},
  placa:{t:'Cable 24 pines',s:'Strimer · 24-pin cable'},
  superiores:{t:'Ventiladores arriba',s:'Galahad · radiador · top fans'},
  bomba:{t:'Bomba',s:'Galahad · AIO pump'},
  memoria:{t:'Memoria',s:'RAM · 2 × DDR5'}
};
let destino='general';
const infoDisp=k=>estado?.informe?.dispositivos?.[k]||null;
const sinControl=k=>k!=='general'&&infoDisp(k)?.conectado===false;
// Puente que no informa de esta luz (anterior a ella): sigue en su arcoíris de fábrica.
const sinInforme=k=>{const d=estado?.informe?.dispositivos;return !d||!d[k];};
function pintarDestinos(){
  $('destinos').innerHTML=[['general',{t:'General',s:'Ventiladores y el resto · all'}],...Object.entries(DISPOSITIVOS)].map(([k,d])=>{
    const propia=k!=='general'&&luz.dispositivos?.[k];
    const sub=sinControl(k)?'sin control · no control':(propia?'luz propia · own':d.s);
    return `<button class="destino${k===destino?' on':''}${sinControl(k)?' sin':''}" data-destino="${k}"><b>${d.t}</b><small>${sub}</small></button>`;
  }).join('');
  const info=infoDisp(destino),propia=destino!=='general'&&luz.dispositivos?.[destino];
  const rpm=info?.rpm?' · '+info.rpm+' rpm':'';
  $('destinoDesc').textContent=destino==='general'?'Los ventiladores con pantalla y las luces sin luz propia (cables, ventiladores de arriba, bomba y memoria).'
    :sinControl(destino)?(info.motivo||'El puente no controla esta luz.')
    :(propia?'Luz propia: no sigue a la general.':'Sigue la luz general. Cambia algo para darle luz propia.')+rpm;
  $('seguirGeneral').hidden=!propia;
  $('controlesLuz').classList.toggle('bloqueado',sinControl(destino));
  $('sigueFila').hidden=destino!=='general';
}
$('destinos').onclick=e=>{const b=e.target.closest('.destino');if(!b)return;destino=b.dataset.destino;pintarLuz();};
$('seguirGeneral').onclick=()=>{const d={...luz.dispositivos};delete d[destino];luz.dispositivos=d;editandoLuz=true;pintarLuz();};
// Lo que enseñan los controles: la luz propia del destino o, si no tiene, la general.
const vista=()=>destino!=='general'&&luz.dispositivos?.[destino]||luz;
// Cambiar algo con un dispositivo elegido le da luz propia (copia de la general la primera vez).
function editar(f){
  if(destino==='general')f(luz);
  else{const d={...luz.dispositivos};d[destino]={...(d[destino]||{efecto:luz.efecto,color:hex(luz.color),brillo:luz.brillo,velocidad:luz.velocidad})};f(d[destino]);luz.dispositivos=d;}

$('efectos').innerHTML=EFECTOS.map(([k,t])=>`<button class="efecto" data-efecto="${k}">${t}</button>`).join('');
$('swatches').innerHTML=SWATCHES.map(c=>`<button style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join('');
function pintarLuz(){
  const v=vista();
  document.querySelectorAll('.efecto[data-efecto]').forEach(b=>b.classList.toggle('on',b.dataset.efecto===v.efecto));
  $('color').value=hex((v.colores&&v.colores[0])||v.color);$('brillo').value=v.brillo;$('brilloV').textContent=v.brillo;

document.querySelectorAll('.efecto[data-efecto]').forEach(b=>b.onclick=()=>editar(o=>{o.efecto=b.dataset.efecto;}));
$('swatches').onclick=e=>{const c=e.target.dataset.c;if(!c)return;editar(o=>{o.color=c;delete o.colores;if(o.efecto==='apagado')o.efecto='fijo';});};
$('color').oninput=e=>editar(o=>{o.color=e.target.value;delete o.colores;});
$('brillo').oninput=e=>editar(o=>{o.brillo=+e.target.value;});
$('velocidad').oninput=e=>editar(o=>{o.velocidad=+e.target.value;});

const luzPlana=v=>({efecto:v.efecto,color:hex((v.colores&&v.colores[0])||v.color),brillo:v.brillo,velocidad:v.velocidad});
async function enviarLuz(){
  const ventiladores=Object.fromEntries(Object.entries(luz.ventiladores||{}).map(([n,v])=>[n,luzPlana(v)]));
  const dispositivos=Object.fromEntries(Object.entries(luz.dispositivos||{}).map(([k,v])=>[k,luzPlana(v)]));
  await api('luz',{efecto:luz.efecto,color:hex(luz.color),brillo:luz.brillo,velocidad:luz.velocidad,sigueVideo:luz.sigueVideo,ventiladores,dispositivos});
}
$('aplicarLuz').onclick=async()=>{
  try{$('aplicarLuz').disabled=true;await enviarLuz();editandoLuz=false;toast('Iluminación enviada');refrescar();}
  catch(err){toast(soloLectura?'Tu acceso es de solo lectura':'No se pudo enviar: '+err.message,true);}
  finally{$('aplicarLuz').disabled=false;}
};

// ── Escena 3D ──
const canvas=$('c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
// Cámara como en la foto de PC-COCINA: delante del cristal grande, algo a la derecha y por encima, para ver de cara la
// placa con la columna 5-6-7, el ventilador 1 de la pared trasera (izquierda) y los 2-3-4 del suelo.
const camera=new THREE.PerspectiveCamera(34,1,.1,200);camera.position.set(14.5,7.4,-3);
const controls=new OrbitControls(camera,canvas);controls.target.set(0,2.5,0);controls.enableDamping=true;controls.minDistance=7;controls.maxDistance=28;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0x9fc6ff,0x0a0f1e,.9));
const sol=new THREE.DirectionalLight(0xffffff,1.1);sol.position.set(6,12,8);scene.add(sol);
// Suelo de la store
const suelo=new THREE.Mesh(new THREE.CircleGeometry(12,64),new THREE.MeshStandardMaterial({color:0x070c18,roughness:.85,metalness:.2}));suelo.rotation.x=-Math.PI/2;scene.add(suelo);
const rejilla=new THREE.GridHelper(24,24,0x1d3a6b,0x0e1a33);rejilla.position.y=.002;scene.add(rejilla);
// Caja: cristal templado y perfiles de aluminio oscuro
const caja=new THREE.Group();scene.add(caja);
const W=4.2,H=5.4,D=6.6;   // fondo (x), alto (y), ancho delante-detrás (z): más ancha que alta, como PC-COCINA
const cristal=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),new THREE.MeshPhysicalMaterial({color:0x9fc6ff,transparent:true,opacity:.08,roughness:.05,metalness:0,side:THREE.DoubleSide,depthWrite:false}));cristal.position.y=H/2;caja.add(cristal);
const aristas=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(W,H,D)),new THREE.LineBasicMaterial({color:0x5f86c4,transparent:true,opacity:.55}));aristas.position.y=H/2;caja.add(aristas);
// Interior según la foto de PC-COCINA (6-nov-2026): en la pared del fondo, de izquierda a derecha, los conectores de
// corriente (pasacables), la placa y la columna 5-6-7; gráfica horizontal delante de la placa; bomba del AIO, RAM y
// los dos peines de cables RGB (24 pines en el borde derecho de la placa y PCIe de la gráfica).
const metal=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.6,...o});
const PZ=0.15,PW=3.2,PY=3.0,PH=3.9;   // placa: centro y tamaño en z (ancho) e y (alto)
const placa=new THREE.Mesh(new THREE.BoxGeometry(.12,PH,PW),metal(0x0b1222,{transparent:true,opacity:.75}));placa.position.set(-W/2+.15,PY,PZ);caja.add(placa);
const panel=new THREE.Mesh(new THREE.BoxGeometry(.1,4.2,1.3),metal(0x090e1a));panel.position.set(-W/2+.12,2.7,2.55);caja.add(panel);
for(const [y,z] of [[3.6,2.27],[3.6,2.83],[2.7,2.27],[2.7,2.83],[1.8,2.27],[1.8,2.83]]){
  const pasacables=new THREE.Mesh(new THREE.BoxGeometry(.06,.55,.42),metal(0x02040a,{roughness:.9}));pasacables.position.set(-W/2+.2,y,z);caja.add(pasacables);
}
const arcoiris=(()=>{const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');
  for(let i=0;i<256;i++){g.fillStyle=`hsl(${Math.round(i*1.4)},100%,58%)`;g.fillRect(i,0,1,64);}
  g.fillStyle='rgba(0,0,0,.55)';for(let y=0;y<64;y+=8)g.fillRect(0,y+5,256,3);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;})();
// Otras luces (6-nov-2026): cada una con su material, que imita la luz que le manda el puente (luz propia o la
// general). La memoria, mientras el puente no la controle, enseña su arcoíris de fábrica.
const disp={};
function luzRgb(k,w,h,d){return luzMalla(k,new THREE.BoxGeometry(w,h,d));}
function luzMalla(k,geo,extra={}){
  const tex=arcoiris.clone();tex.wrapS=THREE.RepeatWrapping;tex.needsUpdate=true;
  const mat=new THREE.MeshBasicMaterial({map:tex,...extra});
  const m=new THREE.Mesh(geo,mat);m.userData.disp=k;
  (disp[k]=disp[k]||{mallas:[],mats:[],tex:[]}).mallas.push(m);disp[k].mats.push(mat);disp[k].tex.push(tex);
  return m;
}
const gpu=new THREE.Mesh(new THREE.BoxGeometry(1.7,.42,3.3),metal(0x141a2a,{roughness:.4,metalness:.7}));gpu.position.set(-W/2+1.06,1.85,PZ+.2);caja.add(gpu);
const aio=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.3,40),metal(0x1a2236,{roughness:.3,metalness:.8}));aio.rotation.z=Math.PI/2;aio.position.set(-1.8,3.75,PZ+.9);caja.add(aio);
const espejo=luzMalla('bomba',new THREE.RingGeometry(.16,.42,48),{side:THREE.DoubleSide});espejo.rotation.y=Math.PI/2;espejo.position.set(-1.64,3.75,PZ+.9);caja.add(espejo);
for(const z of [PZ+.1,PZ-.1]){const ram=luzRgb('memoria',.32,1.25,.09);ram.position.set(-1.88,3.8,z);caja.add(ram);}
const peine24=luzRgb('placa',.9,1.3,.16);peine24.position.set(-1.5,3.35,PZ-1.45);caja.add(peine24);
const peinePcie=luzRgb('grafica',.7,.42,2.1);peinePcie.position.set(-.55,1.42,PZ+.75);caja.add(peinePcie);
// Color de cada luz en el instante t: misma imitación que los anillos (para el gemelo, no es medida).
function pintarLuces(t){
  const inf=estado?.informe,l=inf?.luz||(estado?luz:null);
  for(const [k,d] of Object.entries(disp)){
    const fabrica=!l||sinControl(k)||(inf&&sinInforme(k));   // sin luz, sin control o puente que no la conoce: arcoíris de fábrica
    const p=fabrica?{efecto:'arcoiris',brillo:3,velocidad:2}:(l.dispositivos?.[k]||l);
    const brillo=Math.max(.12,(p.brillo??4)/4),vel=.25+(p.velocidad??2)*.25;
    const arco=['arcoiris','ciclo'].includes(p.efecto);
    d.mats.forEach((m,i)=>{
      if(!!m.map!==arco){m.map=arco?d.tex[i]:null;m.needsUpdate=true;}
      if(arco){d.tex[i].offset.x=(t*.12*vel)%1;m.color.setScalar(brillo);return;}
      if(p.efecto==='apagado'){m.color.set(0x0b0f18);return;}
      const c=new THREE.Color(hex((p.colores&&p.colores[0])||p.color));
      if(p.efecto==='respirar')c.multiplyScalar(.2+.8*(.5+.5*Math.sin(t*2*vel)));
      else if(['meteoro','carrera','ola','pista'].includes(p.efecto))c.multiplyScalar(.25+.75*(.5+.5*Math.sin(t*3*vel+i)));
      m.color.copy(c.multiplyScalar(brillo));
    });
  }
}
// Radiador del AIO en el techo, con sus tres ventiladores sin pantalla: su luz es la de la Galahad («superiores»).
const radiador=new THREE.Mesh(new THREE.BoxGeometry(1.5,.22,4.4),new THREE.MeshStandardMaterial({color:0x0d1322,roughness:.5,metalness:.6}));radiador.position.set(-.2,H-.3,-.2);caja.add(radiador);
for(const z of [-1.65,-.2,1.25]){const r=luzMalla('superiores',new THREE.TorusGeometry(.6,.045,8,48));r.rotation.x=Math.PI/2;r.position.set(-.2,H-.43,z);caja.add(r);}
// Ventiladores
const loader=new THREE.TextureLoader();loader.setCrossOrigin('use-credentials');
const vents={};
function crearVentilador(n){
  const g=new THREE.Group(),d=DISPOSICION[n];
  const marco=new THREE.Mesh(new THREE.BoxGeometry(1.42,1.42,.24),new THREE.MeshStandardMaterial({color:0x0c111d,roughness:.5,metalness:.6}));g.add(marco);
  const hueco=new THREE.Mesh(new THREE.CylinderGeometry(.66,.66,.26,48,1,true),new THREE.MeshStandardMaterial({color:0x05070d,side:THREE.DoubleSide}));hueco.rotation.x=Math.PI/2;g.add(hueco);
  const aspas=new THREE.Group();
  for(let i=0;i<9;i++){const a=new THREE.Mesh(new THREE.BoxGeometry(.5,.12,.02),new THREE.MeshStandardMaterial({color:0x1b2235,transparent:true,opacity:.75}));a.position.x=.38;const p=new THREE.Group();p.rotation.z=i*Math.PI*2/9;a.rotation.x=.5;p.add(a);aspas.add(p);}
  aspas.position.z=.04;g.add(aspas);
  const lcdMat=new THREE.MeshBasicMaterial({color:0x111111});
  const lcd=new THREE.Mesh(new THREE.CircleGeometry(.36,48),lcdMat);lcd.position.z=.14;g.add(lcd);
  const anilloMat=new THREE.MeshBasicMaterial({color:0x223344});
  const anillo=new THREE.Mesh(new THREE.TorusGeometry(.66,.035,12,72),anilloMat);anillo.position.z=.13;g.add(anillo);
  const halo=new THREE.Mesh(new THREE.RingGeometry(.69,.86,72),new THREE.MeshBasicMaterial({color:0x223344,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false}));halo.position.z=.135;g.add(halo);
  g.position.set(...d.p);g.lookAt(new THREE.Vector3(...d.p).add(new THREE.Vector3(...d.n)));
  g.userData.n=n;caja.add(g);
  vents[n]={g,aspas,lcd,lcdMat,anilloMat,halo,tex:null};
}
for(const n of VENTILADORES)crearVentilador(n);
function actualizarTexturas(){
  for(const n of VENTILADORES){
    const v=vents[n];
    loader.load(API+'/miniatura/'+n+'.jpg?t='+Date.now(),tex=>{tex.colorSpace=THREE.SRGBColorSpace;v.tex?.dispose();v.tex=tex;v.lcdMat.map=tex;v.lcdMat.color.set(0xffffff);v.lcdMat.needsUpdate=true;},undefined,()=>{});
    const img=document.querySelector(`img[data-mini="${n}"]`);if(img)img.src=API+'/miniatura/'+n+'.jpg?t='+Date.now();
  }
  if(seleccionado)$('dImg').src=API+'/miniatura/'+seleccionado+'.jpg?t='+Date.now();
}
// Clic en un ventilador 3D → detalle
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);
  const luces=Object.values(disp).flatMap(d=>d.mallas);
  const hit=ray.intersectObjects([...Object.values(vents).map(v=>v.g),...luces],true)[0];if(!hit)return;
  if(hit.object.userData.disp){destino=hit.object.userData.disp;pintarLuz();toast(DISPOSITIVOS[destino].t+': elige su luz en Iluminación');return;}
  let o=hit.object;while(o&&!o.userData.n)o=o.parent;if(o)abrir(o.userData.n);});

// Color que muestra cada anillo, imitando el efecto del controlador (para el gemelo, no es medida).
// En secuencia la luz acompaña siempre al vídeo, como en el puente: solo el activo, y en fijo si la general
// está apagada o es «respirar» (efecto de grupo).
function colorAnillo(n,t){
  const inf=estado?.informe,l=(inf?.luz)||luz,e=inf?.escena,secuencia=e?.modo==='secuencia';
  let propia=l?.ventiladores?.[n]||l;
  if(secuencia&&propia&&['apagado','respirar'].includes(propia.efecto))propia={...propia,efecto:'fijo'};
  if(!l||propia.efecto==='apagado')return new THREE.Color(0x0b0f18);
  const brillo=(propia.brillo||4)/4,vel=.25+(propia.velocidad??2)*.25,base=new THREE.Color(hex((propia.colores&&propia.colores[0])||propia.color));
  let c=base.clone();
  if(l.sigueVideo&&e?.modo==='sincro'&&!activoSincro(e,n))return new THREE.Color(0x0b0f18);
  if(secuencia&&turnoSecuencia(e)!==n)return new THREE.Color(0x0b0f18);
  switch(propia.efecto){
    case 'arcoiris':c.setHSL((t*.12*vel+n*.14)%1,1,.55);break;
    case 'ciclo':c.setHSL((t*.1*vel)%1,1,.55);break;
    case 'respirar':c.multiplyScalar(.2+.8*(.5+.5*Math.sin(t*2*vel)));break;
    case 'meteoro':case 'carrera':case 'ola':{const fase=(t*vel*1.4-n*.45)%7;c.multiplyScalar(.15+.85*Math.max(0,1-Math.abs(((fase%7)+7)%7-3.5)/1.6));break;}
  }
  return c.multiplyScalar(Math.max(.08,brillo));
}
function activoSincro(e,n){
  const orden=e.orden||VENTILADORES,pos=orden.indexOf(n);if(pos<0)return false;
  const paso=Math.floor(Math.max(0,(Date.now()+desfasePC-(e.epoch||0))/1000)/(e.paso||4)),N=orden.length;
  return ((((pos-paso)%N)+N)%N)<(e.piezas||[]).length;
}
// Secuencia (mismo cálculo que escena.mjs · turnoSecuencia del puente): la pieza en cada ventilador, en orden, `cada`
// segundos si se pidió; si no, lo que dura (`duracion`, la mide el puente) y 10 s si no se sabe (una imagen).
function turnoSecuencia(e){
  const orden=e.orden||VENTILADORES,d=e.cada>0?e.cada:(e.duracion>0?e.duracion:10);
  const vuelta=Math.floor(Math.max(0,(Date.now()+desfasePC-(e.epoch||0))/1000)/d);
  return orden[vuelta%orden.length];
}

function tamano(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',tamano);tamano();
const reloj=new THREE.Clock();
function bucle(){
  requestAnimationFrame(bucle);
  const t=reloj.getElapsedTime();
  for(const n of VENTILADORES){
    const v=vents[n],f=(estado?.informe?.fans||[]).find(x=>x.n===n),rpm=f?.rpm||600;
    v.aspas.rotation.z-=rpm/600*.06;
    const c=colorAnillo(n,t);v.anilloMat.color.copy(c);v.halo.material.color.copy(c);
    const el=document.querySelector(`.vent[data-n="${n}"] .disco`);if(el)el.style.setProperty('--anillo','#'+c.getHexString());
  }
  if(seleccionado)$('dImg').style.borderColor='#'+colorAnillo(seleccionado,t).getHexString();
  pintarLuces(t);
  controls.update();renderer.render(scene,camera);
}
bucle();

// ── Estado en vivo ──
async function refrescar(){
  try{
    estado=await api('estado');
    const on=estado.enLinea,visto=estado.visto?Math.round((estado.ahora-estado.visto)/1000):null;
    $('estado').className='estado '+(on?'on':'off');
    $('estadoTxt').textContent=on?'PC-COCINA en línea':(visto==null?'PC-COCINA sin conectar':'Sin señal · hace '+visto+' s');
    const d=estado.deseado||{},inf=estado.informe||{};
    // Hora de PC-COCINA vista desde aquí: su reloj no tiene por qué coincidir con el del navegador.
    if(inf.at&&estado.visto)desfasePC=(inf.at-estado.visto)-(Date.now()-estado.ahora);
    // Los controles enseñan lo más reciente: lo pedido aquí o lo que la máquina ya aplicó (también
    // puede cambiar en local, desde config.json o su API).
    const vigente=(Number(inf.revision)||0)>=(Number(d.revision)||0)?inf:d;
    if(!editandoEscena&&!popBoton&&(vigente.escena||d.escena)){const e=vigente.escena||d.escena;escena={...escena,...e,ids:{...(e.ids||{})},piezas:[...(e.piezas||[])]};if(JSON.stringify(escena)!==pintadaEscena)pintarModos();}
    pintarSuena();
    if(!editandoLuz&&(vigente.luz||d.luz)){const l=vigente.luz||d.luz;luz={...luz,...l,color:hex((l.colores&&l.colores[0])||l.color),ventiladores:l.ventiladores||{},dispositivos:l.dispositivos||{}};pintarLuz();}
    else pintarDestinos();
    const aplicando=d.revision&&inf.revision!==undefined&&d.revision>inf.revision;
    $('pendEscena').textContent=aplicando?'Aplicando en PC-COCINA…':(d.por?'Último cambio: '+d.por:'');
    $('pendLuz').textContent=aplicando?'Aplicando en PC-COCINA…':'';
    for(const f of inf.fans||[]){const m=document.querySelector(`[data-meta="${f.n}"]`);if(m)m.textContent=`${f.rpm??'—'} rpm · ${f.fps??0} fps`;}
    pintarDetalle();
  }catch(err){
    if(err.message!=='login'){$('estado').className='estado off';
      $('estadoTxt').textContent=err.message==='not_configured'?'Nube sin configurar (falta SUPERCOMPUTER_PC_COCINA_PROXY_KEY)':'Sin conexión con la nube';}
  }finally{$('carga').classList.add('hide');}
}
async function cargarStock(){
  const segura=u=>/^https:\/\/(stock|api)\.admira\.store\//.test(String(u||''))?String(u):'';
  const vale=x=>x&&x.id&&!x.oculto&&['video','image'].includes(x.type);
  const pieza=x=>({id:x.id,num:x.num,title:x.title||x.id,type:x.type,tags:(Array.isArray(x.tags)?x.tags:[]).filter(t=>typeof t==='string'&&t),
    thumb:segura(x.thumbnail)||segura(x.poster)||(x.type==='image'?segura(x.url):'')});
  try{const d=await fetch(STOCK_INDICE).then(r=>{if(!r.ok)throw new Error('indice');return r.json();});
    stock=(d.items||[]).filter(vale).map(pieza).sort((a,b)=>(b.num||0)-(a.num||0));}
  catch{try{const d=await fetch(STOCK).then(r=>r.json());stock=(d.items||[]).filter(vale).map(pieza);}catch{stock=[];}}
  const cuenta={};for(const p of stock)for(const t of p.tags)cuenta[t]=(cuenta[t]||0)+1;
  tagsOrdenados=Object.entries(cuenta).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'es'));
  if(tagFiltro&&!cuenta[tagFiltro])tagFiltro='';
  pintarModos();
}
pintarModos();pintarLuz();cargarStock();refrescar();
setInterval(refrescar,2500);setInterval(actualizarTexturas,3000);actualizarTexturas();
